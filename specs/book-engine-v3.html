<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Werbz Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Frank+Ruhl+Libre:wght@400;600&display=swap">
<style>
/* ============================================================
   WERBZ BOOK ENGINE v3 — flat-fold page turn (locked look: specs/flip-demo-v3.html)
   Served by /api/book/[slug]?engine=v3. Loads /api/storybooks/[slug] itself.
   Pages are real DOM; text is set with textContent (never parsed as HTML).
   ============================================================ */
:root{
  --table:#e4e1da; --table-2:#d6d2ca; --ink:#24272b; --muted:#666a70; --accent:#2c6a88;
  --chip:#ffffffd9; --chip-line:#0000001a;
  --paper:#fbf9f4; --paper-ink:#2b2621; --paper-muted:#8a8178;
  --cover:#1f3546; --cover-ink:#f1e4c3;
  --font-ui:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  /* Literata for Latin; Frank Ruhl Libre picks up Hebrew glyphs Literata lacks */
  --font-page:"Literata", "Frank Ruhl Libre", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark){
  :root{ --table:#1a1c1f; --table-2:#121315; --ink:#e7e5e0; --muted:#9a9ea5; --accent:#7db4cf; --chip:#2a2d31e0; --chip-line:#ffffff1a; color-scheme:dark; }
}
*{box-sizing:border-box}
html,body{height:100%; margin:0}
body{
  background:radial-gradient(120% 90% at 50% 40%, var(--table) 0%, var(--table-2) 100%);
  background-color:var(--table);
  color:var(--ink); font-family:var(--font-ui); overflow:hidden;
}
[hidden]{display:none!important}
.app{height:100%; display:grid; grid-template-rows:auto 1fr auto;}
.bar{
  display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  padding:12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px));
}
.bar h1{font-size:14px; font-weight:600; margin:0; letter-spacing:.01em; font-family:var(--font-ui), "Frank Ruhl Libre", sans-serif}
.meta{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--muted)}
.chip{background:var(--chip); border:1px solid var(--chip-line); border-radius:999px; padding:5px 12px; font-variant-numeric:tabular-nums; color:var(--ink)}
label.toggle{display:flex; align-items:center; gap:6px; cursor:pointer; user-select:none}
label.toggle input{accent-color:var(--accent)}

.stage{position:relative; display:flex; align-items:center; justify-content:center; touch-action:none; min-height:0; overflow:hidden;}
.wrap{position:relative; transition:transform .55s cubic-bezier(.3,.7,.2,1);}
.book{position:absolute; left:0; top:0; transform-origin:0 0; user-select:none; -webkit-user-select:none;}
.spine{position:absolute; top:0; width:0;}
.status{position:absolute; inset:0; display:grid; place-items:center; font-size:13px; color:var(--muted); pointer-events:none; text-align:center; padding:0 24px}

.page{position:absolute; left:0; top:0; transform-origin:0 0; overflow:hidden; background:var(--paper); color:var(--paper-ink); display:none;}
.page::after{content:""; position:absolute; inset:0; pointer-events:none; z-index:3}
.page.right::after{background:linear-gradient(90deg, rgba(0,0,0,.16) 0, rgba(0,0,0,.05) 4%, rgba(0,0,0,0) 12%);}
.page.left::after{background:linear-gradient(270deg, rgba(0,0,0,.16) 0, rgba(0,0,0,.05) 4%, rgba(0,0,0,0) 12%);}
.page-inner{position:absolute; inset:0; padding:34px 32px 28px; font-family:var(--font-page); display:flex; flex-direction:column;}
/* RTL books: the whole book is mirrored; each page's content is mirrored back so it reads normally */
.rtl .page-inner{transform:scaleX(-1)}

.base{position:absolute; top:0; background:var(--paper); box-shadow:0 18px 40px rgba(0,0,0,.28), 0 3px 8px rgba(0,0,0,.18); display:none;}
.stack{position:absolute; top:2px; display:none; background:repeating-linear-gradient(90deg, #d9d4cb 0 1px, #f6f3ec 1px 2px); border-radius:1px;}
canvas.fx{position:absolute; pointer-events:none;}

/* ---- inner pages: text set at about half the demo size so a page holds more story ---- */
.copy{position:relative; z-index:1; display:flex; flex-direction:column; min-height:0}
.eyebrow{font-family:var(--font-ui), "Frank Ruhl Libre", sans-serif; font-size:8px; letter-spacing:.18em; text-transform:uppercase; color:var(--paper-muted); margin-bottom:12px}
.ptitle{font-size:17px; line-height:1.2; margin:0 0 10px; font-weight:600; text-wrap:balance}
.body p{font-size:10px; line-height:1.62; margin:0 0 8px; text-wrap:pretty; white-space:pre-line}
.body p.drop::first-letter{float:left; font-size:32px; line-height:.9; padding:3px 4px 0 0; font-weight:600}
.a-start{text-align:start} .a-center{text-align:center} .a-end{text-align:end}
/* Hebrew has no capitals; wide tracking just breaks words apart */
.rtl .eyebrow, .rtl .cover .kicker, .rtl .badge, .rtl .back-cover .imprint{letter-spacing:.03em}
.folio{position:relative; z-index:1; margin-top:auto; font-family:var(--font-ui); font-size:8px; color:var(--paper-muted); text-align:center; font-variant-numeric:tabular-nums}
.on-dark{color:#f6f0e4}
.on-dark .eyebrow, .on-dark .folio{color:rgba(255,255,255,.72)}
.bgimg{position:absolute; inset:0; width:100%; height:100%; z-index:0}
.scrim{position:absolute; inset:0; z-index:0; background:linear-gradient(180deg, rgba(0,0,0,.42) 0%, rgba(0,0,0,.18) 45%, rgba(0,0,0,.5) 100%)}

.fig{padding:0}
.pic{position:relative; width:100%; height:100%; overflow:hidden}
.fig.has-cap .pic{height:86%}
.media{display:block; width:100%; height:100%; object-fit:cover}
.media svg{display:block; width:100%; height:100%}
.fig .cap{height:14%; display:flex; align-items:center; justify-content:center; font-style:italic; font-size:9px; color:var(--paper-muted); padding:0 18px; text-align:center}
.badge{position:absolute; top:10px; inset-inline-start:10px; z-index:2; font-family:var(--font-ui); font-size:8px; letter-spacing:.12em; text-transform:uppercase; background:rgba(0,0,0,.55); color:#fff; padding:3px 7px; border-radius:999px}

.endpaper .page-inner{padding:0; background:
  radial-gradient(circle at 12px 12px, #c9a85d 2px, transparent 2.5px) 0 0/28px 28px,
  radial-gradient(circle at 26px 26px, #8fa9b8 1.5px, transparent 2px) 0 0/28px 28px,
  #efe6d2;}

/* ---- covers keep the demo's full-size type ---- */
.cover{background:var(--cover)}
.cover .page-inner{color:var(--cover-ink); padding:40px 40px 36px; align-items:center; text-align:center}
.cover .kicker{font-family:var(--font-ui), "Frank Ruhl Libre", sans-serif; font-size:11px; letter-spacing:.24em; text-transform:uppercase; opacity:.75}
.cover h2{font-size:42px; line-height:1.05; margin:14px 0 18px; font-weight:600; text-wrap:balance}
.cover .art{width:100%; flex:1; border:1px solid rgba(241,228,195,.35); padding:8px; min-height:0}
.cover .art > *{width:100%; height:100%; display:block; object-fit:cover}
.cover .author{margin-top:18px; font-style:italic; font-size:17px}
.cover.right::after{background:linear-gradient(90deg, rgba(0,0,0,.35) 0, rgba(255,255,255,.08) 2.5%, rgba(0,0,0,.12) 4.5%, rgba(0,0,0,0) 9%)}
.cover.left::after{background:linear-gradient(270deg, rgba(0,0,0,.35) 0, rgba(255,255,255,.08) 2.5%, rgba(0,0,0,.12) 4.5%, rgba(0,0,0,0) 9%)}
.back-cover .page-inner{justify-content:center}
.back-cover .art{flex:0 0 42%; margin-bottom:22px}
.back-cover blockquote{font-size:22px; font-style:italic; margin:0 0 18px; white-space:pre-line}
.back-cover .imprint{margin-top:auto; font-family:var(--font-ui); font-size:11px; letter-spacing:.2em; text-transform:uppercase; opacity:.6}

.nav{position:absolute; top:50%; transform:translateY(-50%); z-index:5; width:44px; height:44px; border-radius:50%; border:1px solid var(--chip-line); background:var(--chip); color:var(--ink); display:grid; place-items:center; cursor:pointer; font-size:20px;}
.nav:disabled{opacity:.3; cursor:default}
.nav:focus-visible, .bar input:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.nav.prev{left:max(12px, env(safe-area-inset-left, 0px))}
.nav.next{right:max(12px, env(safe-area-inset-right, 0px))}
/* RTL: "next" sits on the left, mirroring the book */
.rtl .nav.prev{left:auto; right:max(12px, env(safe-area-inset-right, 0px))}
.rtl .nav.next{right:auto; left:max(12px, env(safe-area-inset-left, 0px))}
.hint{text-align:center; font-size:12.5px; color:var(--muted); padding:10px max(16px, env(safe-area-inset-right, 0px)) 14px max(16px, env(safe-area-inset-left, 0px))}
.hint kbd{font-family:var(--font-ui); font-size:11px; border:1px solid var(--chip-line); background:var(--chip); border-radius:4px; padding:1px 5px}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <h1 id="bookTitle">&nbsp;</h1>
    <div class="meta">
      <span id="debugTools" hidden style="display:flex;gap:10px">
        <label class="toggle" for="foldDebug"><input type="checkbox" id="foldDebug"> Show fold line</label>
        <label class="toggle" for="slowMo"><input type="checkbox" id="slowMo"> Slow motion</label>
      </span>
      <span class="chip" id="counter">Loading</span>
    </div>
  </header>
  <main class="stage" id="stage">
    <button class="nav prev" id="prevBtn" aria-label="Previous page">‹</button>
    <div class="wrap" id="wrap">
      <div class="book" id="book">
        <div class="spine" id="spine"></div>
      </div>
    </div>
    <button class="nav next" id="nextBtn" aria-label="Next page">›</button>
    <div class="status" id="status">Loading story…</div>
  </main>
  <div class="hint" id="hint">Grab any corner or edge and drag. Click a page to turn it. <kbd>←</kbd> <kbd>→</kbd> also work.</div>
</div>

<script>
(async () => {
const $ = id => document.getElementById(id);
const stage = $('stage'), wrap = $('wrap'), book = $('book'), spine = $('spine');
const search = new URLSearchParams(location.search);
const DEBUG = search.get('debug') === '1';
if (DEBUG) $('debugTools').hidden = false;
const slug = search.get('slug') || location.pathname.split('/').filter(Boolean).pop() || '';

/* ============================================================
   DATA: /api/storybooks/[slug] -> canonical { cover?, pages[], end? }
   ============================================================ */
let sb;
try {
  const res = await fetch('/api/storybooks/' + encodeURIComponent(slug), { cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const json = await res.json();
  sb = json && (json.storybook || json);
  if (!sb || typeof sb !== 'object') throw new Error('empty');
} catch (err) {
  $('status').textContent = "This story couldn't be loaded. Check that it is published, then refresh.";
  $('counter').textContent = 'Not loaded';
  console.error('[werbz v3] load failed', err);
  return;
}

const RTL = String((sb.theme && sb.theme.direction) || sb.direction || 'ltr').toLowerCase() === 'rtl';
if (RTL) document.body.classList.add('rtl');
document.documentElement.lang = RTL ? 'he' : 'en';
document.title = sb.title || 'Werbz Book';
$('bookTitle').textContent = sb.title || '';
if (RTL) $('hint').innerHTML = 'Grab any corner or edge and drag. Click a page to turn it. <kbd>→</kbd> <kbd>←</kbd> also work.';

const clampN = (v,a,b) => Math.max(a, Math.min(b, v));
const rawRatio = typeof sb.pageAspectRatio === 'number' ? sb.pageAspectRatio
  : (sb.theme && typeof sb.theme.pageAspectRatio === 'number' ? sb.theme.pageAspectRatio : null);
const RATIO = Number.isFinite(rawRatio) ? clampN(rawRatio, .55, 1.9) : 440 / 600;   // page width / height
const W = 440, H = Math.round(W / RATIO), M = 300;   // page size (book units), canvas margin

/* ---------- content helpers (all user text goes through textContent) ---------- */
const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const assetUrl = id => '/api/assets/' + encodeURIComponent(id);
const paras = body => (Array.isArray(body) ? body.map(String) : String(body || '').split(/\n\s*\n/))
  .map(s => s.trim()).filter(Boolean);
const alignCls = a => a === 'center' ? 'a-center' : a === 'right' ? 'a-end' : 'a-start';
function isDark(hex){
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); if (!m) return false;
  const n = parseInt(m[1], 16), r = (n>>16)&255, g = (n>>8)&255, b = n&255;
  return (0.2126*r + 0.7152*g + 0.0722*b) / 255 < .5;
}

/* Placeholder illustrations (to be replaced by the graphic orchestrator). */
let gid = 0;
const SCENES = ['lantern', 'forest', 'river'];
function scene(kind){
  const id = 's' + (gid++);
  const stars = Array.from({length:22}, (_,i) => {
    const x = (i*97)%400, y = (i*53)%140 + 8, r = (i%3===0)?1.6:1;
    return `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" opacity="${.35 + (i%4)*.15}"/>`;
  }).join('');
  const lantern = (cx, cy, s=1) => `
    <circle cx="${cx}" cy="${cy}" r="${110*s}" fill="url(#${id}g)"/>
    <path d="M${cx-5*s} ${cy-26*s} q${5*s} ${-12*s} ${10*s} 0" stroke="#3a2a1a" stroke-width="${2.5*s}" fill="none"/>
    <path d="M${cx-16*s} ${cy-16*s}h${32*s}l${-6*s} ${-10*s}h${-20*s}z" fill="#3a2a1a"/>
    <rect x="${cx-12*s}" y="${cy-16*s}" width="${24*s}" height="${32*s}" rx="${4*s}" fill="#ffe6a8"/>
    <rect x="${cx-14*s}" y="${cy+16*s}" width="${28*s}" height="${5*s}" rx="2" fill="#3a2a1a"/>`;
  const defs = `<defs>
    <radialGradient id="${id}g" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffd98a" stop-opacity=".9"/><stop offset=".35" stop-color="#f2a94a" stop-opacity=".35"/><stop offset="1" stop-color="#f2a94a" stop-opacity="0"/></radialGradient>
    <linearGradient id="${id}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${kind==='forest'?'#2b2f4f':'#15304a'}"/><stop offset="1" stop-color="${kind==='forest'?'#c98a62':'#43627a'}"/></linearGradient>
  </defs>`;
  let body = `<rect width="400" height="300" fill="url(#${id}s)"/>` + stars;
  if (kind === 'forest'){
    body += `<circle cx="300" cy="90" r="26" fill="#f6e3b5" opacity=".9"/>`;
    for (let row=0; row<3; row++){
      const base = 220 + row*30, col = ['#3d4a4a','#2b3838','#1c2727'][row];
      for (let i=-1; i<12; i++){
        const x = i*38 + (row%2)*19, hh = 70 + ((i*31+row*17)%40);
        body += `<path d="M${x} ${base} l19 ${-hh} l19 ${hh}z" fill="${col}"/>`;
      }
      body += `<rect x="0" y="${base}" width="400" height="${300-base}" fill="${col}"/>`;
    }
    body += lantern(120, 250, .7);
  } else if (kind === 'river'){
    body += `<circle cx="200" cy="80" r="34" fill="#f6ecd0"/>
      <path d="M0 170 Q200 150 400 175 V300 H0Z" fill="#1d3344"/>
      <path d="M-20 300 C120 230 160 200 200 188 C240 200 300 230 420 300Z" fill="#335a74"/>
      <ellipse cx="200" cy="215" rx="26" ry="5" fill="#f6ecd0" opacity=".7"/>
      <ellipse cx="200" cy="232" rx="34" ry="4" fill="#f6ecd0" opacity=".45"/>
      <ellipse cx="200" cy="252" rx="44" ry="4" fill="#f6ecd0" opacity=".3"/>`;
  } else {
    body += `<path d="M0 228 Q100 188 200 218 T400 208 V300 H0Z" fill="#22394b"/>
             <path d="M0 258 Q120 228 240 253 T400 248 V300 H0Z" fill="#142634"/>` + lantern(200, 190);
  }
  const wrapEl = h('div', 'media');
  wrapEl.innerHTML = `<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${defs}${body}</svg>`;
  return wrapEl;
}
// A real uploaded image, falling back to a placeholder scene if it is missing or fails to load.
function picture(assetId, fit, fallbackKind){
  if (!assetId) return scene(fallbackKind);
  const img = h('img', 'media');
  img.alt = ''; img.decoding = 'async'; img.draggable = false;
  img.style.objectFit = fit === 'contain' ? 'contain' : 'cover';
  img.onerror = () => img.replaceWith(scene(fallbackKind));
  img.src = assetUrl(assetId);
  return img;
}

/* ---------- faces ---------- */
const hasCanonical = 'cover' in sb || 'end' in sb;
const middle = Array.isArray(sb.pages) ? sb.pages : [];
const coverPage = hasCanonical ? sb.cover : null;
const endPage = hasCanonical ? sb.end : null;

function coverFace(){
  const c = (coverPage && coverPage.content) || {};
  const inner = h('div', 'page-inner');
  inner.append(h('div', 'kicker', c.eyebrow || 'A Werbz Story'));
  inner.append(h('h2', null, c.title || sb.title || ''));
  const art = h('div', 'art');
  art.append(picture(sb.coverAssetId && !String(sb.coverAssetId).startsWith('asset-cover-') ? sb.coverAssetId
    : (c.backgroundAssetId || c.assetId || null), 'cover', 'lantern'));
  inner.append(art);
  const sub = paras(c.body)[0];
  if (sub && sub.length <= 90) inner.append(h('div', 'author', sub));
  return { cls:'cover', inner, bg: c.background || null };
}
function backFace(){
  const c = (endPage && endPage.content) || {};
  const inner = h('div', 'page-inner');
  const img = c.backgroundAssetId || c.assetId || c.poster || null;
  if (img){ const art = h('div', 'art'); art.append(picture(img, 'cover', 'river')); inner.append(art); }
  const line = c.title || paras(c.body)[0] || sb.summary || 'Thanks for reading.';
  inner.append(h('blockquote', null, line));
  inner.append(h('div', 'imprint', 'werbz stories'));
  return { cls:'cover back-cover', inner, bg: c.background || null };
}
function endpaperFace(){ return { cls:'endpaper', inner: h('div', 'page-inner') }; }
function blankFace(){ return { cls:'', inner: h('div', 'page-inner') }; }

let firstText = true;
function contentFace(p, num){
  const c = (p && p.content) || {};
  const kind = c.kind || 'text';
  const fallback = SCENES[num % SCENES.length];
  if (kind === 'image' || kind === 'video' || kind === 'embed'){
    const inner = h('div', 'page-inner fig' + (c.caption ? ' has-cap' : ''));
    const pic = h('div', 'pic');
    const asset = kind === 'image' ? (c.assetId || c.src) : c.poster;
    pic.append(picture(asset, c.fit, fallback));
    if (kind !== 'image') pic.append(h('span', 'badge', kind === 'video' ? 'Video' : 'Interactive'));
    inner.append(pic);
    if (c.caption) inner.append(h('div', 'cap', c.caption));
    return { cls:'', inner };
  }
  // text
  const inner = h('div', 'page-inner ' + alignCls(c.align));
  let dark = isDark(c.background);
  if (c.backgroundAssetId){
    const bg = picture(c.backgroundAssetId, c.backgroundFit, fallback);
    bg.classList.add('bgimg');
    inner.append(bg, h('div', 'scrim'));
    dark = true;
  }
  if (dark) inner.classList.add('on-dark');
  const copy = h('div', 'copy');
  if (c.eyebrow) copy.append(h('div', 'eyebrow', c.eyebrow));
  if (c.title) copy.append(h('h2', 'ptitle', c.title));
  const ps = paras(c.body);
  if (ps.length){
    const body = h('div', 'body');
    ps.forEach((t, i) => body.append(h('p', i === 0 && firstText && !RTL && !c.title ? 'drop' : '', t)));
    copy.append(body);
    firstText = false;
  }
  inner.append(copy, h('div', 'folio', String(num)));
  return { cls:'', inner, bg: c.background || null };
}

// cover | endpaper | story pages… | (blank to keep pairs even) | endpaper | back cover
const FACES = [coverFace(), endpaperFace()];
middle.forEach((p, i) => FACES.push(contentFace(p, i + 1)));
if (middle.length % 2 === 1) FACES.push(blankFace());
FACES.push(endpaperFace(), backFace());

const N = FACES.length, LEAVES = N / 2;

/* ---------- build DOM ---------- */
const pageEls = FACES.map((f, i) => {
  const el = h('div', `page ${i % 2 === 0 ? 'right' : 'left'} ${f.cls}`.trim());
  el.style.width = W + 'px'; el.style.height = H + 'px';
  if (f.bg) el.style.background = f.bg;
  if (RTL) f.inner.dir = 'rtl';
  el.append(f.inner);
  spine.appendChild(el);
  return el;
});
const mk = (cls, z) => { const e = document.createElement('div'); e.className = cls; e.style.zIndex = z; spine.appendChild(e); return e; };
const baseL = mk('base', 0), baseR = mk('base', 0), stackL = mk('stack', 0), stackR = mk('stack', 0);
[baseL, baseR].forEach(b => { b.style.width = W + 'px'; b.style.height = H + 'px'; });
baseL.style.left = -W + 'px'; baseR.style.left = '0px';
stackL.style.height = stackR.style.height = (H - 4) + 'px';

function mkCanvas(z){
  const c = document.createElement('canvas'); c.className = 'fx'; c.style.zIndex = z;
  c.style.left = -(W + M) + 'px'; c.style.top = -M + 'px';
  c.style.width = (2*W + 2*M) + 'px'; c.style.height = (H + 2*M) + 'px';
  spine.appendChild(c); return c;
}
const cvUnder = mkCanvas(2), cvDrop = mkCanvas(4), cvShade = mkCanvas(6);
const ctxs = [cvUnder, cvDrop, cvShade].map(c => c.getContext('2d'));
const PAPER = getComputedStyle(document.documentElement).getPropertyValue('--paper').trim() || '#fbf9f4';

book.style.width = 2*W + 'px'; book.style.height = H + 'px';
spine.style.left = W + 'px'; spine.style.height = H + 'px';

// Let fonts settle before the first frame so text doesn't jump (never wait more than 2.5s).
try { await Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 2500))]); } catch (_) {}
$('status').hidden = true;

/* ============================================================
   FLIP ENGINE — identical to the locked v3 demo (specs/flip-demo-v3.html),
   plus RTL mirroring in toBook / resize / updateChrome / keys.
   ============================================================ */

/* ---------- geometry helpers ---------- */
const sub = (a,b) => ({x:a.x-b.x, y:a.y-b.y});
const dot = (a,b) => a.x*b.x + a.y*b.y;
const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
const lerp = (a,b,t) => ({x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t});
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const easeInOut = t => t<.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
const easeOut = t => 1 - Math.pow(1-t, 3);
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t*t*(3 - 2*t); };
// A soft shadow falloff: (1-f)^2.2 sampled into stops, so the edge feathers instead of ending in a line.
function featherStops(g, alpha, [r, gg, b]){
  for (let i = 0; i <= 10; i++){
    const f = i / 10, a = alpha * Math.pow(1 - f, 2.2);
    g.addColorStop(f, `rgba(${r},${gg},${b},${a.toFixed(3)})`);
  }
}

// Keep the page attached at the spine: P must stay within reach of both spine ends.
function constrain(P, G){
  const S1 = {x:0, y:0}, S2 = {x:0, y:H};
  const r1 = dist(G, S1), r2 = dist(G, S2);
  let p = {x:Math.min(P.x, G.x), y:P.y};   // pulling outward does nothing
  for (let i = 0; i < 6; i++){
    for (const [S, r] of [[S1, r1], [S2, r2]]){
      const d = dist(p, S);
      if (d > r){ p = {x:S.x + (p.x-S.x)*r/d, y:S.y + (p.y-S.y)*r/d}; }
    }
  }
  return p;
}
// Sutherland–Hodgman against one half-plane: keep points where sign*((p-Q)·n) >= 0
function clipHalf(poly, Q, n, sign){
  const out = [];
  for (let i = 0; i < poly.length; i++){
    const a = poly[i], b = poly[(i+1) % poly.length];
    const da = sign*dot(sub(a,Q), n), db = sign*dot(sub(b,Q), n);
    if (da >= 0) out.push(a);
    if ((da >= 0) !== (db >= 0)) out.push(lerp(a, b, da/(da-db)));
  }
  return out;
}
const reflect = (p, Q, n) => { const k = 2*dot(sub(p,Q), n); return {x:p.x - k*n.x, y:p.y - k*n.y}; };
const poly2css = pts => pts.length < 3 ? 'polygon(0 0,0 0,0 0)' : `polygon(${pts.map(p => `${p.x.toFixed(2)}px ${p.y.toFixed(2)}px`).join(',')})`;
function invert(m){ // m = [a,b,c,d,e,f]
  const [a,b,c,d,e,f] = m, det = a*d - b*c;
  return [d/det, -b/det, -c/det, a/det, (c*f - d*e)/det, (b*e - a*f)/det];
}
const apply = (m, p) => ({x:m[0]*p.x + m[2]*p.y + m[4], y:m[1]*p.x + m[3]*p.y + m[5]});

/* ---------- book state ---------- */
let spread = 0;      // spread k shows pages 2k-1 (left) and 2k (right)
let flip = null;     // {s, G, P, mode:'peek'|'drag'|'anim', ...} in s-frame (front page always on the right)
let raf = 0, scale = 1, dpr = 1;
const DIR = RTL ? -1 : 1;   // screen-x sign of the book's own coordinates
const leftIdx  = k => { const i = 2*k - 1; return i >= 0 && i < N ? i : null; };
const rightIdx = k => { const i = 2*k;     return i >= 0 && i < N ? i : null; };
const canFlip = s => s > 0 ? rightIdx(spread) !== null : leftIdx(spread) !== null;

function hideAll(){ pageEls.forEach(e => { e.style.display = 'none'; }); }
function place(i, x, z){
  if (i === null) return null;
  const el = pageEls[i];
  el.style.display = 'block'; el.style.zIndex = z;
  el.style.transform = `translate(${x}px,0)`; el.style.clipPath = 'none';
  return el;
}
function clearFx(){ ctxs.forEach(c => { c.setTransform(1,0,0,1,0,0); c.clearRect(0,0,c.canvas.width,c.canvas.height); }); }

function showStatic(){
  hideAll(); clearFx();
  place(leftIdx(spread), -W, 1);
  place(rightIdx(spread), 0, 1);
  updateChrome();
}

function updateChrome(){
  const L = leftIdx(spread), R = rightIdx(spread);
  // centre a closed book on its single visible cover
  const shift = L === null ? -W/2 : R === null ? W/2 : 0;
  wrap.style.transform = `translateX(${shift*scale*DIR}px)`;
  baseL.style.display = L === null ? 'none' : 'block';
  baseR.style.display = R === null ? 'none' : 'block';
  const tl = Math.min(9, spread * 1.3), tr = Math.min(9, (LEAVES - spread) * 1.3);
  stackL.style.display = (L === null || spread <= 1) ? 'none' : 'block';
  stackR.style.display = (R === null || spread >= LEAVES - 1) ? 'none' : 'block';
  stackL.style.width = tl + 'px'; stackL.style.left = (-W - tl) + 'px';
  stackR.style.width = tr + 'px'; stackR.style.left = W + 'px';
  const storyPages = middle.length;
  $('counter').textContent = L === null ? `Cover · ${storyPages} pages`
    : R === null ? `Back cover · ${storyPages} pages`
    : `Spread ${spread} of ${LEAVES - 1}`;
  $('prevBtn').disabled = !canFlip(-1);
  $('nextBtn').disabled = !canFlip(1);
}

/* ---------- the turn ---------- */
function renderFlip(){
  const f = flip, s = f.s;
  const front = s > 0 ? rightIdx(spread) : leftIdx(spread);
  const back  = s > 0 ? leftIdx(spread+1) : rightIdx(spread-1);
  const under = s > 0 ? rightIdx(spread+1) : leftIdx(spread-1);
  const still = s > 0 ? leftIdx(spread) : rightIdx(spread);
  hideAll(); clearFx();
  place(still, s > 0 ? -W : 0, 1);
  place(under, s > 0 ? 0 : -W, 1);
  const frontEl = place(front, s > 0 ? 0 : -W, 3);

  const G = f.G, P = f.P = constrain(f.P, G);
  const d = dist(G, P);
  if (d < 0.05) return;

  const n = {x:(G.x-P.x)/d, y:(G.y-P.y)/d};          // points toward the grabbed side
  const Q = lerp(G, P, .5);                           // a point on the fold line
  const rect = [{x:0,y:0},{x:W,y:0},{x:W,y:H},{x:0,y:H}];
  const keep = clipHalf(rect, Q, n, -1);              // part of the front that stays down
  const lifted = clipHalf(rect, Q, n, +1);            // part that turns over (reveals the page under it)
  const flap = lifted.map(p => reflect(p, Q, n));     // where that part lands, showing its back

  const toB = p => ({x:s*p.x, y:p.y});                // s-frame -> book coords
  const oFront = s > 0 ? 0 : -W;
  frontEl.style.clipPath = poly2css(keep.map(toB).map(p => ({x:p.x - oFront, y:p.y})));

  // Back face: mirror it onto the front's footprint, then reflect across the fold.
  const oBack = s > 0 ? -W : 0;
  const backMap = e => {
    const bx = e.x + oBack;                // landed book x
    const m = {x:-(s*bx), y:e.y};          // matching point on the front (s-frame)
    const r = reflect(m, Q, n);
    return {x:s*r.x, y:r.y};
  };
  const o = backMap({x:0,y:0}), ex = sub(backMap({x:1,y:0}), o), ey = sub(backMap({x:0,y:1}), o);
  const mat = [ex.x, ex.y, ey.x, ey.y, o.x, o.y];
  const inv = invert(mat);
  if (back !== null){
    const el = pageEls[back];
    el.style.display = 'block'; el.style.zIndex = 5;
    el.style.transform = `matrix(${mat.map(v => v.toFixed(5)).join(',')})`;
    el.style.clipPath = poly2css(flap.map(toB).map(p => apply(inv, p)));
  }

  /* ---- shading ---- */
  const t = clamp(d / (2*W), 0, 1);
  const k = Math.pow(Math.sin(Math.PI * t), .55);     // 0 at rest, peaks mid-turn, 0 when landed
  // light/shade strength: full almost as soon as the page lifts, fades only as it lands
  const ks = Math.min(1, t * 6) * (1 - smooth(.82, 1, t));
  const QB = toB(Q), nB = {x:s*n.x, y:n.y};
  const flapB = flap.map(toB), liftedB = lifted.map(toB);
  let flapW = 1; for (const p of flap) flapW = Math.max(flapW, -dot(sub(p,Q), n));
  const K = scale * dpr;
  ctxs.forEach(c => c.setTransform(K, 0, 0, K, (W + M)*K, M*K));
  const path = (c, pts) => { c.beginPath(); pts.forEach((p,i) => i ? c.lineTo(p.x,p.y) : c.moveTo(p.x,p.y)); c.closePath(); };

  // 1) shadow on the newly revealed page: darkest at the fold, with a long soft
  //    feather that grows with the flap (the more page is turned, the wider it gets)
  if (under !== null){
    const c = ctxs[0], len = clamp(flapW * .85, 28, W * .9);
    const g = c.createLinearGradient(QB.x, QB.y, QB.x + nB.x*len, QB.y + nB.y*len);
    featherStops(g, .40 * ks, [0,0,0]);
    c.save(); path(c, liftedB); c.clip(); c.fillStyle = g; c.fillRect(-W-M, -M, 2*W+2*M, H+2*M); c.restore();
  }
  // 2) soft drop shadow under the flap (falls on the page below and the opposite page)
  {
    const c = ctxs[1];
    // wide and faint, so the flap's white edge sits on a soft halo, not a grey outline
    c.save(); c.shadowColor = `rgba(0,0,0,${.20*k + .02})`; c.shadowBlur = (16 + 34*k) * K;
    c.shadowOffsetX = -nB.x * 10 * k * K; c.shadowOffsetY = (-nB.y * 10 * k + 4) * K;
    c.fillStyle = PAPER; path(c, flapB); c.fill(); c.restore();
  }
  // 3) light on the flap, all proportional to the flap's width so it grows with the page:
  //    white at the fold blending straight into a grey that grows with the page.
  {
    const c = ctxs[2], L = Math.max(flapW, 1);
    const g = c.createLinearGradient(QB.x, QB.y, QB.x - nB.x*L, QB.y - nB.y*L);
    const rgba = (r, a) => `rgba(${r},${r},${r},${Math.max(0, a).toFixed(3)})`;
    const whiteW = Math.min(21, L * .30);                // white band, less on tiny folds
    const greyW  = Math.min(L * .80, 30 + L * .17);      // grows with the flap
    const at = px => clamp(px / L, 0, 1);
    g.addColorStop(0,                       rgba(255, .55*ks));   // white at the fold
    g.addColorStop(at(whiteW * .5),         rgba(255, .48*ks));
    g.addColorStop(at(whiteW),              rgba(255, .36*ks));
    g.addColorStop(at(whiteW + greyW*.35),  rgba(0,   .20*ks));   // blends into the grey peak
    g.addColorStop(at(whiteW + greyW*.65),  rgba(0,   .09*ks));
    g.addColorStop(at(whiteW + greyW),      rgba(0,   0));        // feathers out into paper
    g.addColorStop(1,                       rgba(0,   0));
    c.save(); path(c, flapB); c.clip(); c.fillStyle = g; c.fillRect(-W-M, -M, 2*W+2*M, H+2*M); c.restore();
  }
  if ($('foldDebug').checked){
    const c = ctxs[2], dir = {x:-nB.y, y:nB.x};
    c.save(); c.lineWidth = 1.5 / scale; c.strokeStyle = '#e0457b'; c.setLineDash([6/scale, 5/scale]);
    c.beginPath(); c.moveTo(QB.x - dir.x*2000, QB.y - dir.y*2000); c.lineTo(QB.x + dir.x*2000, QB.y + dir.y*2000); c.stroke();
    c.setLineDash([]);
    const GB = toB(G), PB = toB(P);
    c.fillStyle = '#2c6a88'; c.beginPath(); c.arc(GB.x, GB.y, 6/scale, 0, 7); c.fill();
    c.fillStyle = '#e0457b'; c.beginPath(); c.arc(PB.x, PB.y, 6/scale, 0, 7); c.fill();
    c.restore();
  }
}

function kick(){ if (!raf) raf = requestAnimationFrame(tick); }
function tick(now){
  raf = 0;
  if (!flip) return;
  if (flip.mode === 'peek'){
    flip.P = lerp(flip.P, flip.target, .2);
    if (dist(flip.target, flip.G) < .01 && dist(flip.P, flip.G) < .4){ flip = null; showStatic(); return; }
  } else if (flip.mode === 'anim'){
    const a = flip.anim;
    const u = clamp((now - a.t0) / a.dur, 0, 1), e = a.ease(u);
    const p = lerp(a.from, a.to, e);
    p.y -= a.lift * Math.sin(Math.PI * u);
    flip.P = p;
    if (u >= 1){ finishAnim(); return; }
  }
  renderFlip();
  kick();
}
function finishAnim(){
  const a = flip.anim;
  if (a.commit) spread += flip.s;
  flip = null; showStatic();
}
const durMul = () => ($('slowMo').checked ? 4 : 1) * (matchMedia('(prefers-reduced-motion: reduce)').matches ? .5 : 1);

function animateTo(commit, dur, lift, ease){
  const G = flip.G, from = constrain(flip.P, G);
  flip.mode = 'anim';
  flip.anim = { from, to: commit ? {x:-G.x, y:G.y} : {...G}, t0: performance.now(), dur: dur * durMul(),
                lift, ease, commit };
  kick();
}
// Turn by button / key / click: from the peeked corner if one is up, else the bottom corner.
function turn(s){
  if (flip && flip.mode === 'anim'){ if (flip.anim.commit) finishAnim(); else { flip = null; showStatic(); } }
  if (flip && flip.mode === 'drag') return;
  if (!canFlip(s)) return;
  if (!(flip && flip.mode === 'peek' && flip.s === s)){
    flip = {s, G:{x:W, y:H}, P:{x:W, y:H}};
  }
  const bottom = flip.G.y > H/2 ? 1 : -1;
  animateTo(true, 820, bottom * H * .2, easeInOut);
}

/* ---------- input ---------- */
function toBook(e){
  const r = book.getBoundingClientRect(), sc = r.width / (2*W);
  const x = (e.clientX - r.left)/sc - W;
  return {x: x * DIR, y:(e.clientY - r.top)/sc};   // RTL: the book is mirrored on screen
}
// Grabbing near the top/bottom snaps to that corner; anywhere else grabs the outer edge at that height.
function grabPoint(sp){
  if (sp.y < H*.18) return {x:W, y:0};
  if (sp.y > H*.82) return {x:W, y:H};
  return {x:W, y:sp.y};
}
const CORNER = 90;
function hover(pt){
  if (flip && flip.mode !== 'peek') return;
  const s = pt.x >= 0 ? 1 : -1, sp = {x:s*pt.x, y:pt.y};
  const near = canFlip(s) && sp.x > W - CORNER && sp.x < W + 14 && sp.y > -14 && sp.y < H + 14 && (sp.y < CORNER || sp.y > H - CORNER);
  if (near){
    const top = sp.y < H/2, C = {x:W, y: top ? 0 : H};
    if (!flip || flip.s !== s || flip.G.y !== C.y){ flip = {s, G:C, P:{...C}, mode:'peek'}; }
    // the corner leans toward the cursor a little
    const pull = clamp((W + 14 - sp.x) / CORNER, 0, 1);
    flip.target = {x: W - 46 - 30*pull, y: top ? 20 + 14*pull : H - 20 - 14*pull};
    kick();
  } else if (flip && flip.mode === 'peek'){
    flip.target = {...flip.G}; kick();
  }
}

stage.addEventListener('pointerdown', e => {
  if (e.button !== 0 || e.target.closest('.nav')) return;
  const pt = toBook(e);
  if (pt.x < -W || pt.x > W || pt.y < 0 || pt.y > H) return;
  if (flip && flip.mode === 'anim'){ if (flip.anim.commit) finishAnim(); else { flip = null; showStatic(); } }
  const s = pt.x >= 0 ? 1 : -1;
  if (!canFlip(s)) return;
  const sp = {x:s*pt.x, y:pt.y};
  let G, P;
  if (flip && flip.mode === 'peek' && flip.s === s){ G = flip.G; P = constrain(flip.P, G); }
  else { G = grabPoint(sp); P = {...G}; }
  const now = performance.now();
  flip = {s, G, P, mode:'drag', offset:sub(sp, P), down:{x:e.clientX, y:e.clientY, t:now, sp}, moved:0, hist:[{x:sp.x, y:sp.y, t:now}]};
  try { stage.setPointerCapture(e.pointerId); } catch (_) {}
  e.preventDefault();
  kick();
});
stage.addEventListener('pointermove', e => {
  const pt = toBook(e);
  if (flip && flip.mode === 'drag'){
    const s = flip.s, sp = {x:s*pt.x, y:pt.y}, now = performance.now();
    flip.P = constrain(sub(sp, flip.offset), flip.G);
    flip.moved = Math.max(flip.moved, Math.hypot(e.clientX - flip.down.x, e.clientY - flip.down.y));
    flip.hist.push({x:sp.x, y:sp.y, t:now});
    while (flip.hist.length > 2 && now - flip.hist[0].t > 100) flip.hist.shift();
    kick();
  } else if (e.pointerType === 'mouse'){
    hover(pt);
  }
});
function release(e){
  if (!flip || flip.mode !== 'drag') return;
  const now = performance.now(), f = flip;
  if (f.moved < 6 && now - f.down.t < 350){
    // a click: turn from the nearest corner (keeps a peeked corner if one is up)
    const C = {x:W, y: f.down.sp.y < H/2 ? 0 : H};
    if (f.G.x !== C.x || f.G.y !== C.y){ f.G = C; f.P = {...C}; }
    animateTo(true, 820, (f.G.y > H/2 ? 1 : -1) * H * .2, easeInOut);
    return;
  }
  const h0 = f.hist[0], h1 = f.hist[f.hist.length - 1];
  const vx = (h1.t - h0.t) > 8 ? (h1.x - h0.x) / (h1.t - h0.t) : 0;   // s-frame px/ms (negative = toward spine)
  const commit = vx < -0.45 ? true : vx > 0.45 ? false : f.P.x < W * 0.15;
  const to = commit ? {x:-f.G.x, y:f.G.y} : f.G;
  const remaining = dist(f.P, to) / (2*W);
  const lift = commit ? (f.G.y > H/2 ? 1 : -1) * H * .08 * remaining : 0;
  animateTo(commit, 200 + 520*remaining, lift, easeOut);
}
stage.addEventListener('pointerup', release);
stage.addEventListener('pointercancel', release);
stage.addEventListener('pointerleave', () => { if (flip && flip.mode === 'peek'){ flip.target = {...flip.G}; kick(); } });

$('prevBtn').addEventListener('click', () => turn(-1));
$('nextBtn').addEventListener('click', () => turn(1));
if (RTL){ $('prevBtn').textContent = '›'; $('nextBtn').textContent = '‹'; }
addEventListener('keydown', e => {
  // the arrow pointing toward the book's opening edge turns forward
  if (e.key === 'ArrowRight'){ turn(RTL ? -1 : 1); e.preventDefault(); }
  if (e.key === 'ArrowLeft'){ turn(RTL ? 1 : -1); e.preventDefault(); }
});
$('foldDebug').addEventListener('change', () => { if (flip) kick(); });

/* ---------- sizing ---------- */
function resize(){
  const r = stage.getBoundingClientRect();
  const padX = r.width < 700 ? 24 : 140, padY = 28;
  scale = Math.max(.2, Math.min((r.width - padX) / (2*W), (r.height - padY) / H, 1.25));
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  wrap.style.width = 2*W*scale + 'px'; wrap.style.height = H*scale + 'px';
  // RTL mirrors the whole book; page content is mirrored back in CSS (.rtl .page-inner)
  book.style.transform = RTL ? `translateX(${2*W*scale}px) scale(${-scale}, ${scale})` : `scale(${scale})`;
  for (const c of [cvUnder, cvDrop, cvShade]){
    c.width = Math.round((2*W + 2*M) * scale * dpr);
    c.height = Math.round((H + 2*M) * scale * dpr);
  }
  if (flip) renderFlip(); else showStatic();
}
addEventListener('resize', resize);
resize();
})();
</script>
</body>
