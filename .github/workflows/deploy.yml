name: Deploy to VPS

# Auto-deploy on every push to main. The job runs directly on the Werbz VPS via
# a self-hosted GitHub Actions runner, so there is no SSH hop from a
# GitHub-hosted runner. It is scoped to ONLY the werbz-stories app/process —
# it never touches the RB monolith or other PM2 apps.
on:
  push:
    branches: [main]
  workflow_dispatch: {} # also allow manual "Run workflow" from the Actions tab

concurrency:
  # Never run two deploys at once; cancel an in-flight deploy if a newer push lands.
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy werbz-stories
    runs-on: [self-hosted, werbz-vps]
    timeout-minutes: 30
    steps:
      - name: Deploy locally on Werbz VPS
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="/var/www/werbz-stories"
          PM2_APP="werbz-stories"
          DEPLOY_LOCK="/tmp/werbz-stories.deploy.lock"

          echo "==> Deploying ${PM2_APP} from ${APP_DIR} on self-hosted runner"
          exec 9>"${DEPLOY_LOCK}"
          flock -w 1800 9

          cd "${APP_DIR}"
          export PATH="/usr/bin:/usr/local/bin:$PATH"

          echo "==> sync to origin/main"
          git fetch origin main
          git reset --hard origin/main

          echo "==> install deps"
          pnpm install --frozen-lockfile

          echo "==> clean previous Next build output"
          rm -rf .next

          echo "==> build"
          pnpm build

          echo "==> db migrate"
          pnpm db:migrate

          echo "==> restart ONLY ${PM2_APP}"
          pm2 restart "${PM2_APP}" --update-env
          pm2 save
          pm2 status "${PM2_APP}"
