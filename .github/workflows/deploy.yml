name: Deploy to VPS

# Auto-deploy on every push to main. The job SSHes into the Hostinger VPS and
# runs the standard werbz-stories runbook. It is scoped to ONLY the
# werbz-stories app/process — it never touches the RB monolith or other PM2 apps.
on:
  push:
    branches: [main]
  workflow_dispatch: {} # also allow manual "Run workflow" from the Actions tab

concurrency:
  # Never run two deploys at once; cancel an in-flight deploy if a newer push lands.
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy werbz-stories
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          # Fail the whole job if any command fails (pipefail catches piped cmds too).
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail

            APP_DIR="/var/www/werbz-stories"
            PM2_APP="werbz-stories"

            echo "==> Deploying ${PM2_APP} from ${APP_DIR}"
            cd "${APP_DIR}"

            # Tools live in /usr/bin on this VPS; ensure it's on PATH for the
            # non-interactive SSH shell.
            export PATH="/usr/bin:/usr/local/bin:$PATH"

            echo "==> sync to origin/main"
            git fetch origin main
            git reset --hard origin/main

            echo "==> install deps"
            pnpm install --frozen-lockfile

            echo "==> build"
            pnpm build

            echo "==> db migrate (no seed)"
            pnpm db:migrate

            echo "==> restart ONLY ${PM2_APP}"
            pm2 restart "${PM2_APP}" --update-env
            pm2 save

            echo "==> done"
            pm2 status "${PM2_APP}"
